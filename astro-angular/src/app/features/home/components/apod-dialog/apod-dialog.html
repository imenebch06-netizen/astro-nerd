<div class="bg-[var(--bg-surface)] text-[var(--text-main)] p-6 rounded-2xl max-w-4xl border border-[var(--border-color)] shadow-2xl transition-colors">
  <div class="flex justify-between items-start gap-4 mb-4">
    <div>
      <span class="text-xs font-mono font-bold text-sky-600 dark:text-cyan-400 uppercase tracking-widest">{{ data.date }}</span>
      <h2 class="text-xl font-black text-[var(--text-main)] leading-snug">{{ data.title }}</h2>
    </div>
    <button mat-icon-button mat-dialog-close class="text-[var(--text-muted)] hover:text-[var(--text-main)] transition-colors">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (data.media_type === 'image') {
    <img [src]="data.hdurl || data.url" 
         [alt]="data.title" 
         class="w-full max-h-[65vh] object-contain rounded-xl mb-4 border border-[var(--border-color)] bg-black/5 dark:bg-black/40" />
  } @else if (data.media_type === 'video') {
    <div class="relative aspect-video w-full mb-4 rounded-xl overflow-hidden border border-[var(--border-color)] bg-black/5 dark:bg-black/40">
      <iframe [src]="safeVideoUrl" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
    </div>
  }

  <p class="text-xs sm:text-sm text-[var(--text-muted)] leading-relaxed max-h-36 overflow-y-auto pr-2 border-t border-[var(--border-color)] pt-3">
    {{ data.explanation }}
  </p>
</div>
