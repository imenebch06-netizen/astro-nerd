<div class="min-h-screen bg-space-950 text-slate-100 flex flex-col font-sans">
  
  <!-- Sidenav Container for Mobile + Desktop Layout -->
  <mat-sidenav-container class="flex-1 bg-transparent">
    
    <!-- Mobile Navigation Drawer -->
    <mat-sidenav #sidenav mode="over" class="w-64 bg-space-900 border-r border-slate-800 p-4">
      <div class="flex items-center gap-3 mb-8 px-2">
        <mat-icon class="text-space-neonCyan">rocket_launch</mat-icon>
        <span class="text-xl font-bold bg-gradient-to-r from-space-neonCyan to-space-neonPurple bg-clip-text text-transparent">
          Astro Imene
        </span>
      </div>

      <mat-nav-list>
        @for (link of navLinks; track link.path) {
          <a mat-list-item [routerLink]="link.path" routerLinkActive="bg-space-card/50 text-space-neonCyan" (click)="sidenav.close()" class="rounded-lg mb-1">
            <mat-icon matListItemIcon class="text-slate-400">{{ link.icon }}</mat-icon>
            <span matListItemTitle>{{ link.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <!-- Main Page Content -->
    <mat-sidenav-content class="flex flex-col min-h-screen">
      
      <!-- Cosmic Top Header Bar -->
      <mat-toolbar class="!bg-space-900/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50 flex justify-between px-4 sm:px-8">
        
        <!-- Brand Title & Mobile Menu Button -->
        <div class="flex items-center gap-3">
          <button mat-icon-button (click)="sidenav.toggle()" class="sm:hidden text-slate-300">
            <mat-icon>menu</mat-icon>
          </button>

          <div class="flex items-center gap-2 cursor-pointer" routerLink="/home">
            <mat-icon class="text-space-neonCyan text-3xl">rocket_launch</mat-icon>
            <div class="flex flex-col">
              <span class="text-lg font-extrabold tracking-wide bg-gradient-to-r from-space-neonCyan via-indigo-400 to-space-neonPurple bg-clip-text text-transparent">
                Astro Imene
              </span>
              <span class="hidden md:inline text-xs text-slate-400 font-light -mt-1">
                Travel between the edges of the universe
              </span>
            </div>
          </div>
        </div>

        <!-- Desktop Navigation Links -->
        <nav class="hidden sm:flex items-center gap-1">
          @for (link of navLinks; track link.path) {
            <a [routerLink]="link.path" 
               routerLinkActive="!bg-space-card/80 !text-space-neonCyan border-b-2 border-space-neonCyan" 
               class="px-4 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all flex items-center gap-2">
              <mat-icon class="text-base">{{ link.icon }}</mat-icon>
              {{ link.label }}
            </a>
          }
        </nav>
      </mat-toolbar>

      <!-- Main Dynamic Route View Area -->
      <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <router-outlet></router-outlet>
      </main>

      <!-- Footer -->
      <footer class="border-t border-slate-800/60 bg-space-900/40 py-6 text-center text-xs text-slate-500">
        <p>Astro Imene &copy; Rebuilt with Angular & Tailwind CSS</p>
      </footer>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
